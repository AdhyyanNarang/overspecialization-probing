dataset: amazon
config:
  dataset_source: mcauley_multi
  max_reviews: 30000
  test_size: 0.05
  eta: 0.05
  n: 9
  T: 20000
  tau: 0.3
  reg_lambda: 1.0e-09
  num_sample: 150
  N_probe: 500
  probe_num_samples: 15
  probing_set:
    - 3
  p_values:
    - 0
  kappa_values:
    - 0.0
  init_method: random
  plot_seeds_separately: false
  plot_distance_separately: false
  clustering_method: category
  clustering_mode: no_majority
  add_intercept_feature: true
  fit_intercept: false
  run_sgd_baseline: false
  sgd_lr_schedule: constant
  sgd_max_iter: 1000
  lr_schedule: constant
  force_recompute_embeddings: false
  force_recompute_bar_theta: false
  max_plot_iterations: 20000
runner:
  num_seeds: 3
